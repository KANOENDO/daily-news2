<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@page{size:794px 1123px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans CJK JP',sans-serif;font-size:8.5pt;line-height:1.5;color:#222;background:#fff}
.page{width:794px;height:1123px;padding:24px 30px;overflow:hidden;page-break-after:always;position:relative}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #1a2b5f;padding-bottom:4px;margin-bottom:8px}
header h1{font-size:20pt;color:#1a2b5f}header span{font-size:9pt;color:#555}
h2{font-size:11pt;color:#fff;padding:2px 8px;margin:9px 0 5px;border-radius:2px}
.gen h2{background:#1a2b5f}.tech h2{background:#6b3fa0}.hobby h2{background:#e8730c}.job h2{background:#1f7a4d}
.item{margin-bottom:5px}.item b{font-size:9pt}.src{font-size:7.5pt;color:#888;margin-left:4px}
.cm{color:#1a2b5f}.big{border:1px solid #1a2b5f;padding:5px 8px;margin-bottom:6px;background:#f3f5fb}
.big .why{margin-top:2px;font-size:8.5pt}
.idx{display:flex;gap:8px;margin-bottom:6px}.idx div{flex:1;border:1px solid #ccc;padding:5px 8px;text-align:center}
.idx .n{font-size:20pt;font-weight:700}.up{color:#d11}.dn{color:#1a8a3a}.idx small{font-size:8.5pt}
table{border-collapse:collapse;width:100%;margin:3px 0}td,th{border:1px solid #bbb;padding:2px 5px;font-size:8.5pt;text-align:center}
th{background:#eee}.job th{background:#dcefe3}
.hobby td.l,td.l{text-align:left}
.note{font-size:8pt;color:#666}
.cols{display:flex;gap:12px}.cols>div{flex:1}
</style></head><body>
<!--PAGES-->
</body></html>
